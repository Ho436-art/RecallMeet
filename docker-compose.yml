services:
  postgres:
    image: postgres:16-alpine
    container_name: recallmeet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: recallmeet
      POSTGRES_USER: recallmeet
      POSTGRES_PASSWORD: recallmeet_dev_password
    ports:
      - "5432:5432"
    volumes:
      - recallmeet_postgres_data:/var/lib/postgresql/data

volumes:
  recallmeet_postgres_data: